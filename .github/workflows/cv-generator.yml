name: Build CV From Source

on:
  push:
    branches:
      - main
    # paths:
    #   - "main.tex"
    #   - "sections/**"
    #   - "files/**"
    #   - ".github/workflows/cv-generator.yml"
  workflow_dispatch:

# Only one deploy at a time: cancel any in-progress run so concurrent
# builds never race on the force-push to the `pdf` branch.
concurrency:
  group: cv-deploy
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Build CV PDF
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          latexmk_use_xelatex: true

      - name: Stage PDF for deploy
        run: |
          mkdir -p pdf
          cp main.pdf pdf/${{ github.event.repository.name }}_$(date -u +%Y%m%d).pdf

      - name: Deploy PDF to pdf branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./pdf
          publish_branch: pdf
          commit_message: "chore(cv): update $(date -u +%Y%m%d)"
          commit_user_name: github-actions[bot]
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
