name: Build CV From Source

on:
  push:
    branches:
      - main
    # paths:
    #   - "main.tex"
    #   - "sections/**"
    #   - "files/**"
    #   - ".github/workflows/cv-generator.yml"
  workflow_dispatch:

# Cancel any in-progress runs of this workflow when a new commit is pushed to the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build CV PDF
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          latexmk_use_xelatex: true

      - name: Commit changes to pdf branch
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Keep the built PDF aside, then switch to the pdf branch so we
          # commit on top of its current history (fast-forward, no force).
          cp main.pdf ./_cv_main.pdf

          git fetch origin pdf 2>/dev/null || true
          if git show-ref --verify --quiet refs/remotes/origin/pdf; then
            git checkout -B pdf origin/pdf
          else
            git checkout --orphan pdf
            git rm -rf --quiet . 2>/dev/null || true
          fi

          mkdir -p pdf
          mv ./_cv_main.pdf pdf/${{ github.event.repository.name }}_$(date -u +%Y%m%d).pdf

          git add pdf/

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore(cv): (update=$(date -u +%Y%m%d))"
          git push origin pdf
